[project]
name = "agentic-hello-world"
version = "0.1.0"
description = "A radically-transparent AI agent harness, built one capability at a time."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ollama>=0.4",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

# Ship only the app package. web/ (static assets), scripts/, and tests/ are not
# distributable packages — without this, setuptools' flat-layout auto-discovery
# fails once more than one top-level directory exists.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
