<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="blog.css">
<style>
  html,body{width:1200px;height:675px}
  .stage{gap:26px;padding:40px 50px 70px}
  .headline{font-size:40px}
  .steps{display:flex;gap:16px;align-items:stretch;justify-content:center;margin-top:6px}
  .step{width:225px;background:rgba(255,255,255,.02);border:1px solid var(--line);
        border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;
        animation:sweep 6s linear infinite}
  .step .verb{font-size:21px;font-weight:700}
  .step .chip{font-size:17px;border-left:6px solid var(--line);border-radius:7px;
        background:var(--panel);padding:9px 12px}
  .chip.u{border-left-color:var(--user)} .chip.a{border-left-color:var(--assistant)}
  .chip.c{border-left-color:var(--cloud)} .chip.llm{text-align:center;font-weight:700;letter-spacing:.1em}
  .between{display:flex;align-items:center;font-size:26px;color:var(--muted)}
  .s2{animation-delay:-1.5s} .s3{animation-delay:-3s} .s4{animation-delay:-4.5s}

  @keyframes sweep{
    0%{border-color:var(--line);box-shadow:none;transform:translateY(0)}
    3%{border-color:var(--cloud);box-shadow:0 0 34px rgba(78,201,176,.35);transform:translateY(-5px)}
    16%{border-color:var(--cloud);box-shadow:0 0 34px rgba(78,201,176,.35);transform:translateY(-5px)}
    22%,100%{border-color:var(--line);box-shadow:none;transform:translateY(0)}
  }
</style></head>
<body>
  <div class="stage">
    <div class="kicker">The whole "Hello World" loop</div>
    <div class="headline">Wrap → send → receive → <span class="accent">display</span>.</div>

    <div class="steps">
      <div class="step s1"><div class="verb">WRAP</div><div class="chip u">user · Hello World!</div></div>
      <div class="between">▶</div>
      <div class="step s2"><div class="verb">SEND</div><div class="chip llm">LLM</div></div>
      <div class="between">▶</div>
      <div class="step s3"><div class="verb">RECEIVE</div><div class="chip a">assistant · Hello World!</div></div>
      <div class="between">▶</div>
      <div class="step s4"><div class="verb">DISPLAY</div><div class="chip c">screen · Hello World!</div></div>
    </div>

    <div class="sub" style="font-size:21px">Generated by the model. Displayed by the harness.</div>
    <div class="foot">Building an AI Agent from Zero · github.com/hoquem/agentic-hello-world</div>
  </div>
</body></html>
