<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root{--bg:#14161a;--fg:#e8e8e8;--user:#4a90e2;--assistant:#3fae5a;--system:#f5a623;--cloud:#4ec9b0;--muted:#7e8794;--red:#e0564b;--line:#2a2e37}
  *{margin:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:radial-gradient(900px 520px at 50% 30%, #1c222c, var(--bg));
       color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:40px 48px;display:flex;flex-direction:column}
  .head{font-weight:900;font-size:92px;line-height:.98;letter-spacing:-.02em}
  .head .diff{color:var(--red)}
  .cards{flex:1;display:flex;gap:28px;align-items:center;margin-top:26px}
  .card{flex:1;background:#0d0f12;border:1px solid var(--line);border-radius:18px;
        padding:30px 32px;height:340px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:38px;color:#dfe4ea}
  .code .s{color:var(--assistant)}
  .tag{position:absolute;top:24px;right:24px;font-weight:800;font-size:26px;padding:8px 18px;border-radius:999px}
  .tag.ok{background:rgba(63,174,90,.16);color:var(--assistant);border:1px solid var(--assistant)}
  .tag.maybe{background:rgba(224,86,75,.16);color:var(--red);border:1px solid var(--red)}
  .bubble{font-family:ui-monospace,Menlo,monospace;font-size:34px;color:#fff;background:#1d2330;
          border-left:6px solid var(--cloud);border-radius:0 12px 12px 0;padding:12px 18px;width:fit-content}
  .bubble.b2{margin-left:60px;border-color:var(--system);opacity:.85}
  .bubble.b3{margin-left:120px;border-color:var(--user);opacity:.7}
  .llama{position:absolute;top:18px;left:26px;font-size:48px}
</style></head><body>
  <div class="head">SAME CODE.<br><span class="diff">DIFFERENT ANSWER.</span></div>
  <div class="cards">
    <div class="card">
      <div class="tag ok">ALWAYS &#10003;</div>
      <div class="code">print(<span class="s">"Hello, World!"</span>)</div>
      <div class="code" style="color:var(--assistant);font-size:34px">&rarr; Hello, World!</div>
    </div>
    <div class="card">
      <div class="llama">&#129433;</div>
      <div class="tag maybe">&hellip;MAYBE?</div>
      <div class="bubble">"Hello World!"</div>
      <div class="bubble b2">"Hi there! 👋"</div>
      <div class="bubble b3">"Ahoy, matey!"</div>
    </div>
  </div>
</body></html>
