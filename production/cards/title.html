<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root{--bg:#14161a;--fg:#e8e8e8;--user:#4a90e2;--assistant:#3fae5a;--system:#f5a623;--cloud:#4ec9b0;--muted:#6f7884}
  *{margin:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:radial-gradient(1300px 760px at 50% 42%, #1b212b, var(--bg));
       color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
  .kicker{font-size:28px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .t1{font-size:150px;font-weight:700;line-height:1}
  .t2{font-size:66px;color:#aeb6c2;font-weight:600}
  .t2 .accent{color:var(--cloud);font-weight:700}
  .cursor{display:inline-block;width:34px;height:64px;background:var(--cloud);
          vertical-align:-8px;margin-left:8px;border-radius:4px}
  .dots{display:flex;gap:20px;margin-top:26px}
  .dot{width:20px;height:20px;border-radius:50%}
  .foot{position:absolute;bottom:64px;font-size:24px;color:var(--muted);letter-spacing:.04em}
</style></head><body>
  <div class="kicker">Building an AI Agent from Zero &middot; Episode 1</div>
  <div class="t1">Hello, World</div>
  <div class="t2">&mdash; but with an <span class="accent">LLM</span><span class="cursor"></span></div>
  <div class="dots">
    <span class="dot" style="background:var(--system)"></span>
    <span class="dot" style="background:var(--user)"></span>
    <span class="dot" style="background:var(--assistant)"></span>
    <span class="dot" style="background:var(--cloud)"></span>
  </div>
  <div class="foot">running on Ollama &middot; github.com/hoquem/agentic-hello-world</div>
</body></html>
